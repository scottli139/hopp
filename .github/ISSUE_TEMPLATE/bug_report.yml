name: Bug Report / 缺陷报告
description: Report a bug in Hopp (Chinese or English both fine / 中英文均可)
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么
      description: A clear description of the bug. / 清晰描述这个 bug。
      placeholder: When I ..., the app ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Type ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hopp version / 版本号
      description: Shown in About, e.g. 0.7.0 / 关于页面里的版本，如 0.7.0
      placeholder: "0.7.0"
    validations:
      required: false
  - type: input
    id: flutter_version
    attributes:
      label: Flutter version / Flutter 版本
      description: Run `fvm flutter --version`. / 运行 `fvm flutter --version`。
      placeholder: "3.27.4"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else / 其他信息
      description: Screenshots, sample request, error logs. / 截图、示例请求、错误日志。
    validations:
      required: false
