<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Rabbit/Hopp Character -->
  <g transform="translate(256, 256)">
    <!-- Ears -->
    <ellipse cx="-45" cy="-80" rx="28" ry="70" fill="white" transform="rotate(-15)"/>
    <ellipse cx="45" cy="-80" rx="28" ry="70" fill="white" transform="rotate(15)"/>
    <ellipse cx="-45" cy="-80" rx="15" ry="45" fill="#FBBF24" transform="rotate(-15)"/>
    <ellipse cx="45" cy="-80" rx="15" ry="45" fill="#FBBF24" transform="rotate(15)"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="20" rx="100" ry="90" fill="white"/>
    
    <!-- Eyes -->
    <circle cx="-35" cy="0" r="12" fill="#1F2937"/>
    <circle cx="-38" cy="-4" r="4" fill="white"/>
    <circle cx="35" cy="0" r="12" fill="#1F2937"/>
    <circle cx="32" cy="-4" r="4" fill="white"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="25" rx="8" ry="6" fill="#EC4899"/>
    
    <!-- Mouth -->
    <path d="M -15 35 Q 0 45 15 35" stroke="#1F2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Cheeks -->
    <ellipse cx="-60" cy="20" rx="15" ry="10" fill="#FBBF24" opacity="0.6"/>
    <ellipse cx="60" cy="20" rx="15" ry="10" fill="#FBBF24" opacity="0.6"/>
    
    <!-- API/Request symbolism - Small brackets -->
    <text x="-75" y="80" font-family="monospace" font-size="40" font-weight="bold" fill="#6366F1" opacity="0.8">{</text>
    <text x="55" y="80" font-family="monospace" font-size="40" font-weight="bold" fill="#6366F1" opacity="0.8">}</text>
  </g>
  
  <!-- Sparkle decorations -->
  <circle cx="80" cy="120" r="6" fill="white" opacity="0.8"/>
  <circle cx="420" cy="150" r="4" fill="white" opacity="0.6"/>
  <circle cx="100" cy="380" r="5" fill="white" opacity="0.7"/>
  <circle cx="400" cy="360" r="7" fill="white" opacity="0.5"/>
</svg>