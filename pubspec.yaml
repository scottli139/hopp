name: hopp
description: "Hopp - A lightweight, cross-platform API testing tool built with Flutter"
publish_to: 'none'
version: 0.11.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # HTTP Client
  dio: ^5.8.0+1
  
  # Storage
  shared_preferences: ^2.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  logger: ^2.5.0
  intl: ^0.19.0
  uuid: ^4.5.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  crypto: ^3.0.3
  # OpenAPI/Swagger YAML 解析（F9.4 导入）
  yaml: ^3.1.2
  # AES 加密（F8.3 变量转换管道；底层为纯 Dart 的 pointycastle）
  encrypt: ^5.0.3
  url_launcher: ^6.3.1
  
  # UI Components
  flutter_code_editor: ^0.3.2
  multi_split_view: ^3.6.0
  tabbed_view: ^1.22.0
  data_table_2: ^2.5.18
  flutter_svg: ^2.0.17
  
  # Icons
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  freezed: ^2.4.5
  json_serializable: ^6.7.0
  hive_generator: ^2.0.1
  mockito: ^5.4.0
  
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/images/logo.svg
    - assets/images/logo_text.svg
