          <body>
            <div class="lang-switch">
              <a href="index.html">English</a>
              <a href="index.zh-CN.html" class="active">简体中文</a>
            </div>
            <div class="container">
              <div class="hero">
                <h1>🐰 Hopp</h1>
                <p>轻量级、跨平台的 API 请求测试工具</p>
                <div class="ai-badge">
                  🤖 100% AI 开发 · 前端 <a href="https://www.moonshot.cn/" target="_blank">Kimi Code CLI</a> · 后端 <a href="https://www.moonshot.cn/" target="_blank">Kimi 2.5</a>
                </div>
                <div class="badges">
                  <img src="https://github.com/scottli139/hopp/actions/workflows/ci.yml/badge.svg" alt="CI">
                  <img src="https://img.shields.io/badge/License-MIT-yellow.svg" alt="License">
                </div>
                <a href="https://github.com/scottli139/hopp/releases" class="btn btn-primary">下载安装</a>
                <a href="https://github.com/scottli139/hopp" class="btn">GitHub</a>
                
                <div class="features">
                  <div class="feature-card">
                    <h3>🚀 轻量快速</h3>
                    <p>基于 Tauri 构建，启动 &lt; 2s，内存 &lt; 200MB</p>
                  </div>
                  <div class="feature-card">
                    <h3>💻 跨平台</h3>
                    <p>支持 macOS、Windows、Linux</p>
                  </div>
                  <div class="feature-card">
                    <h3>🔧 完整功能</h3>
                    <p>HTTP/HTTPS、WebSocket、环境变量、集合</p>
                  </div>
                  <div class="feature-card">
                    <h3>🌍 多语言</h3>
                    <p>支持简体中文和英语</p>
                  </div>
                </div>
                
                <div class="links">
                  <a href="./docs/PRD.md">需求文档</a>
                  <a href="./docs/ARCHITECTURE.md">架构设计</a>
                  <a href="./docs/DEVELOPMENT_PLAN.md">开发计划</a>
                  <a href="./README.zh-CN.md">使用文档</a>
                </div>
              </div>
              <footer>
                <p>Built with ❤️ by Hopp Team · 🐰 Hop to your APIs!</p>
              </footer>
            </div>
          </body>
          </html>
          EOF
          
          cp LICENSE _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
